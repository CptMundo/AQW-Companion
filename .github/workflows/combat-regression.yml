name: Combat simulator regression
on:
  push:
    branches:
      - feature/combat-standard-60s-dps
    paths:
      - 'js/combat-engine.js'
      - 'js/combat-timeline.js'
      - 'js/combat-engine-ui.js'
      - 'index.html'
      - 'js/damage-formulas.js'
      - 'js/damage-kernel.js'
      - 'js/dps-calibration.js'
      - 'tests/**'
      - '.github/workflows/combat-regression.yml'
  pull_request:
    paths:
      - 'js/combat-engine.js'
      - 'js/combat-timeline.js'
      - 'js/damage-formulas.js'
      - 'js/damage-kernel.js'
      - 'js/dps-calibration.js'
      - 'tests/**'
      - '.github/workflows/combat-regression.yml'
jobs:
  combat-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify combat engine
        run: node tests/combat-engine.test.cjs
      - name: Verify damage formulas
        run: node tests/damage-formulas.test.cjs
      - name: Verify VHL dynamic-haste timeline
        run: node tests/combat-timeline.test.cjs
      - name: Verify official item boost and critical model guards
        run: node tests/damage-kernel.test.cjs
      - name: Verify website integration and scripts
        run: node tests/site-script-smoke.test.cjs
      - name: Verify 60s calibration and comparability
        run: node tests/dps-calibration.test.cjs
      - name: Exercise combat UI interactions (mock DOM)
        run: node tests/combat-ui-integration.test.cjs
