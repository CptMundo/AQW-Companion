name: Badge source inspection
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspect_badge_sources.py'
      - '.github/workflows/badge-source-inspection.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4
      - run: python scripts/inspect_badge_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: badge-source-catalog
          path: badge-source-catalog.json
          retention-days: 7
