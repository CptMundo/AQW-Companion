name: Wishlist recipe integrity
on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/recipe-integrity.js'
      - 'css/recipe-coverage.css'
      - 'tests/recipe-integrity.test.cjs'
      - 'tests/remove-damage-simulator.test.cjs'
      - '.github/workflows/recipe-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/recipe-integrity.js'
      - 'css/recipe-coverage.css'
      - 'tests/recipe-integrity.test.cjs'
      - 'tests/remove-damage-simulator.test.cjs'
      - '.github/workflows/recipe-integrity.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audited recipes and safe project upgrades
        run: node tests/recipe-integrity.test.cjs
