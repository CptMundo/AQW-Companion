name: Visual guide and public extension package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture_guide.cjs
      - run: python3 scripts/build_public_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: AQW-Companion-visual-guide
          path: |
            extension/quick-start.html
            extension/icons/icon128.png
            extension/guide-images/guide-*.png
            downloads/AQW_Companion.zip
            downloads/AQW_Companion.sha256
          retention-days: 14
