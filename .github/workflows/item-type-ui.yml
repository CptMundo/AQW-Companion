name: Wishlist & Explore type UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/cape-icon.svg'
      - 'assets/class-armor-icon.svg'
      - 'tests/cape-icon-navigation.test.cjs'
      - 'css/analytics-consent.css'
      - 'tests/item-type-ui.test.cjs'
      - '.github/workflows/item-type-ui.yml'
  push:
    branches:
      - feature/wishlist-explore-types-compact-privacy-20261123
      - main
    paths:
      - 'index.html'
      - 'assets/cape-icon.svg'
      - 'assets/class-armor-icon.svg'
      - 'tests/cape-icon-navigation.test.cjs'
      - 'css/analytics-consent.css'
      - 'tests/item-type-ui.test.cjs'
      - '.github/workflows/item-type-ui.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify item type consistency and privacy UI
        run: node tests/item-type-ui.test.cjs
      - name: Verify cape artwork and Ultras navigation order
        run: node tests/cape-icon-navigation.test.cjs
