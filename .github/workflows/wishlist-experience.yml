name: Wishlist recipe and achievements checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/recipe-integrity.js'
      - 'js/wishlist-finds.js'
      - 'js/account-statistics.js'
      - 'css/recipe-coverage.css'
      - 'css/account-statistics.css'
      - 'tests/**'
      - '.github/workflows/wishlist-experience.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/recipe-integrity.js'
      - 'js/wishlist-finds.js'
      - 'js/account-statistics.js'
      - 'css/recipe-coverage.css'
      - 'css/account-statistics.css'
      - 'tests/**'
      - '.github/workflows/wishlist-experience.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All Node regression tests
        run: |
          for test in tests/*.test.cjs; do
            node "$test" || exit 1
          done
      - name: Full published catalog structural scan
        run: node scripts/audit_recipe_catalog.cjs data/companion_database.json review_output/recipe-audit
