name: Update official AQW calendar data
on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh verified AQW news entries
        run: python scripts/update_aqw_calendar.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aqw-calendar.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official AQW calendar news"
            git push
          fi
