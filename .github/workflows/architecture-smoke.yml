name: Architecture extraction smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/brand-*.png'
      - 'css/site.css'
      - 'css/item-icons.css'
      - 'tests/**'
      - 'README.md'
      - 'docs/ARCHITECTURE.md'
      - '.github/workflows/architecture-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/brand-*.png'
      - 'css/site.css'
      - 'css/item-icons.css'
      - 'tests/**'
      - 'README.md'
      - 'docs/ARCHITECTURE.md'
      - '.github/workflows/architecture-smoke.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Node regression tests
        run: |
          for test in tests/*.test.cjs; do
            node "$test" || exit 1
          done
