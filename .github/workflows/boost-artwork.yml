name: Build boost artwork catalog
on:
  pull_request:
    paths:
      - scripts/build-boost-artwork.py
      - .github/workflows/boost-artwork.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: python scripts/build-boost-artwork.py
      - uses: actions/upload-artifact@v4
        with:
          name: boost-artwork-catalog
          path: data/boost-artwork.json
